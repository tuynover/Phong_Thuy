services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phongthuy-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    networks:
      - phongthuy-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phongthuy-frontend
    restart: always
    expose:
      - "80"
    networks:
      - phongthuy-network

  nginx:
    image: nginx:alpine
    container_name: phongthuy-nginx
    restart: always
    # Ánh xạ cổng 80 của máy ảo AWS vào cổng 80 của container Nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - phongthuy-network

  redis:
    image: redis:alpine
    container_name: phongthuy-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - phongthuy-network

networks:
  phongthuy-network:
    driver: bridge

volumes:
  redis-data:

