services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phongthuy-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    networks:
      - phongthuy-network
  
  nginx:
    image: nginx:alpine
    container_name: phongthuy-nginx
    restart: always
    # Ánh xạ cổng 80 của máy ảo AWS vào cổng 80 của container Nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - phongthuy-network

networks:
  phongthuy-network:
    driver: bridge
