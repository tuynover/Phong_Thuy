services:
  backend:
    image: ${DOCKERHUB_USERNAME:-tuynover}/phongthuy-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phongthuy-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    networks:
      - phongthuy-network
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M
  
  frontend:
    image: ${DOCKERHUB_USERNAME:-tuynover}/phongthuy-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phongthuy-frontend
    restart: always
    expose:
      - "80"
    networks:
      - phongthuy-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    image: nginx:alpine
    container_name: phongthuy-nginx
    restart: always
    # Ánh xạ cổng 80 của máy ảo AWS vào cổng 80 của container Nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - phongthuy-network

  redis:
    image: redis:alpine
    container_name: phongthuy-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - phongthuy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

networks:
  phongthuy-network:
    driver: bridge

volumes:
  redis-data:

