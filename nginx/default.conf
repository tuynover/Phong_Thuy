# =========================
# HTTP -> HTTPS
# =========================
server {
    listen 80;
    server_name tuynover.giize.com tuynover.ddns.net tuynover.duckdns.org;

    return 301 https://$host$request_uri;
}

# =========================
# HTTPS
# =========================
server {
    listen 443 ssl http2;
    server_name tuynover.giize.com tuynover.ddns.net tuynover.duckdns.org;

    client_max_body_size 20M;

    # Gzip Compression Optimization for Production
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================
    # SSL
    # =========================

    ssl_certificate     /etc/letsencrypt/live/tuynover.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuynover.ddns.net/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers off;

    # =========================
    # Backend API
    # =========================

    location /api {

        proxy_pass http://backend:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # =========================
    # Health Check
    # =========================

    location /health {

        proxy_pass http://backend:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
    }

    # =========================
    # SEO & Shared URLs Routing
    # =========================

    location ~* ^/(bazi|ziwei|marriage|iching|xemngay)($|/|/record/([a-zA-Z0-9\-]+))$ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/blog($|/|/([a-zA-Z0-9\-]+))$ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Frontend
    # =========================

    location / {

        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}