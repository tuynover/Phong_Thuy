name: CI/CD Pipeline to EC2 via Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -- BƯỚC MỚI: CHẠY UNIT TEST TRƯỚC KHI ĐÓNG GÓI --
      - name: Setup Node.js for Testing
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies and Run Tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/phongthuy-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/phongthuy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            cd phongthuy/Phong_Thuy
            git pull origin main
            
            # Xuất biến môi trường để docker-compose.yml có thể đọc được tag image
            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            
            # Kéo image mới nhất từ Docker Hub về (nhanh vì chỉ tải layer đổi)
            docker compose pull
            
            # Khởi động lại in-place các container thay đổi
            docker compose up -d
            
            # Bắt buộc khởi động lại Nginx để làm mới upstream IPs và dọn dẹp cache ẩn
            docker compose restart nginx
