server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ Single Page Application (SPA) routing, chuyển hướng mọi route không tồn tại về index.html
        try_files $uri $uri/ /index.html;
    }

    # Bật cache cho assets tĩnh để tối ưu tốc độ load
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Cấu hình lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
