server {
    listen 80;
    server_name _;

    # Bật nén Gzip tối ưu hóa băng thông truyền tải mạng cho 10.000 truy cập/ngày
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ Single Page Application (SPA) routing, chuyển hướng mọi route không tồn tại về index.html
        try_files $uri $uri/ /index.html;
    }

    # Bật cache dài hạn cho assets tĩnh đã băm hash tên file
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cấu hình lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
